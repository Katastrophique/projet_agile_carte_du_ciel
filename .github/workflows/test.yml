name: Tests non-main

on:
  pull_request:
    branches:
      - main

jobs:
  browser-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests with simulated window
        run: |
          echo "Start tests"
          SUCCESS=0
          FAIL=0

          for test in tests/*.test.js; do
            echo "Running $test"
            if node -r jsdom-global/register "$test"; then
              echo "$test OK"
              SUCCESS=$((SUCCESS+1))
            else
              echo "$test FAILED"
              FAIL=$((FAIL+1))
              exit 1
            fi
          done

          echo "Summary: $SUCCESS passed, $FAIL failed"

          echo "Test results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Passed tests: $SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "Failed tests: $FAIL" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Node.js with simulated window (jsdom)" >> $GITHUB_STEP_SUMMARY
