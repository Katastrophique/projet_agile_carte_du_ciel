name: Tests (branches non-main)

on:
  push:
    branches-ignore:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install

      - name: Lancer tous les tests avec window simulé
        run: |
          for test in tests/*.test.js; do
            echo "Running $test"
            node -r jsdom-global/register "$test"
          done
