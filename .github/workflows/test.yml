- name: Lancer tous les tests avec window simulé
  run: |
    echo "🧪 Début des tests"
    SUCCESS=0
    FAIL=0

    for test in tests/*.test.js; do
      echo ""
      echo "Running $test"
      if node -r jsdom-global/register "$test"; then
        echo "$test OK"
        SUCCESS=$((SUCCESS+1))
      else
        echo "$test KO"
        FAIL=$((FAIL+1))
        exit 1
      fi
    done

    echo ""
    echo "Résumé : $SUCCESS tests réussis, $FAIL échec(s)"
    echo "Tous les tests sont passés"
