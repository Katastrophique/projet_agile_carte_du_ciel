name: Tests

on:
  push:
    branches-ignore:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Lancer tous les tests *.test.js
        run: |
          for test in tests/*.test.js; do
            echo "Running $test"
            node "$test"
          done
